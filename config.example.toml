# Kopieren nach config.toml und anpassen.

[ftp]
host = "0.0.0.0"          # auf allen Netzwerkschnittstellen lauschen
port = 21                 # muss mit dem Port in der Kamera übereinstimmen
user = "a7v"
password = "lightroom"    # bitte ändern
passive_ports = [60000, 60100]

[import]
# Ordner, den Lightroom Classic unter "Automatisch importieren" überwacht.
# Er muss beim Einrichten in Lightroom leer sein.
watch_dir = "~/Pictures/Lightroom-Watch"

# Laufende Uploads landen zuerst hier (Standard: "<watch_dir>-Eingang").
# Am besten auf derselben Festplatte wie watch_dir lassen.
staging_dir = ""

# Optional: zusätzliche Sicherungskopie jeder empfangenen Datei.
backup_dir = ""

# Welche Dateitypen an Lightroom übergeben werden.
extensions = ["ARW", "JPG", "JPEG", "HIF", "HEIF"]
